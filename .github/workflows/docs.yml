name: Documentation checks

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Validate Markdown hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check Markdown files are non-empty and have no trailing whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          errors = []
          files = sorted(
              path for path in Path(".").rglob("*.md")
              if ".git" not in path.parts
          )
          for path in files:
              text = path.read_text(encoding="utf-8")
              if not text.strip():
                  errors.append(f"{path}: empty file")
              if not text.endswith("\n"):
                  errors.append(f"{path}: missing final newline")
              for number, line in enumerate(text.splitlines(), 1):
                  if line.rstrip(" \t") != line:
                      errors.append(f"{path}:{number}: trailing whitespace")
          if not files:
              errors.append("No Markdown files found")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Validated {len(files)} Markdown files.")
          PY
